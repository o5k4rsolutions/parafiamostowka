<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Styl edytora treści */
        #announcement-content-editable {
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
        }
        #announcement-content-editable table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
        }
        #announcement-content-editable th, #announcement-content-editable td {
            border: 1px solid #d6d3d1;
            padding: 8px;
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-900 flex flex-col min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3 font-serif font-bold text-emerald-900 text-xl tracking-tight">
                <svg class="w-7 h-7 text-emerald-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v20M5 9h14"/></svg>
                <span>Panel CMS</span>
            </div>
            <div id="user-info" class="hidden flex items-center gap-4 text-sm transition-opacity duration-300">
                <span id="user-email" class="text-stone-600 font-medium"></span>
                <button id="logout-btn" class="bg-stone-200 hover:bg-stone-300 text-stone-800 px-3 py-1.5 rounded-lg transition font-medium">Wyloguj</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-10 w-full">
        
        <section id="login-section" class="bg-white rounded-2xl shadow-sm border border-stone-200 p-8 max-w-md mx-auto my-12 transition-all duration-300">
            <h1 class="text-3xl font-serif text-emerald-900 mb-6 text-center">Logowanie do CMS</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-stone-700 mb-1">Adres e-mail</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border border-stone-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-stone-700 mb-1">Hasło</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-stone-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none transition">
                </div>
                <div id="login-error" class="text-red-600 text-sm hidden"></div>
                <button type="submit" id="login-btn" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-xl transition flex justify-center items-center">
                    <span id="login-btn-text">Zaloguj się</span>
                </button>
            </form>
        </section>

        <section id="cms-dashboard" class="hidden space-y-10 transition-all duration-300">
            
            <!-- Add / Edit Form Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-8">
                <h2 id="form-title" class="text-2xl font-serif text-emerald-900 mb-6">Dodaj nowe ogłoszenie</h2>
                <form id="announcement-form" class="space-y-6">
                    <input type="hidden" id="edit-id">
                    <div>
                        <label class="block text-sm font-semibold text-stone-700 mb-1">Tytuł ogłoszenia</label>
                        <input type="text" id="announcement-title" required class="w-full px-4 py-2 border border-stone-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-stone-700 mb-1">Treść ogłoszenia</label>
                        
                        <!-- Pasek narzędzi formatowania -->
                        <div class="flex flex-wrap gap-1.5 p-2 bg-stone-50 border border-stone-300 rounded-t-xl border-b-0 text-stone-700 text-xs items-center">
                            <button type="button" onclick="formatText('bold')" class="p-1.5 hover:bg-stone-200 rounded font-bold px-2.5" title="Pogrubienie">B</button>
                            <button type="button" onclick="formatText('italic')" class="p-1.5 hover:bg-stone-200 rounded italic px-2.5" title="Kursywa">I</button>
                            <button type="button" onclick="formatText('underline')" class="p-1.5 hover:bg-stone-200 rounded underline px-2.5" title="Podkreślenie">U</button>
                            <span class="w-px h-4 bg-stone-300 mx-1"></span>
                            
                            <div class="flex items-center gap-1">
                                <label class="text-[11px] text-stone-500">Kolor:</label>
                                <input type="color" onchange="formatTextColor(this.value)" class="w-6 h-6 border-0 cursor-pointer bg-transparent" title="Kolor tekstu">
                            </div>
                            <div class="flex items-center gap-1 ml-2">
                                <label class="text-[11px] text-stone-500">Tło:</label>
                                <input type="color" value="#ffff00" onchange="formatTextBgColor(this.value)" class="w-6 h-6 border-0 cursor-pointer bg-transparent" title="Kolor tła tekstu">
                            </div>
                            <span class="w-px h-4 bg-stone-300 mx-1"></span>

                            <select onchange="formatTextSize(this.value); this.selectedIndex=0;" class="bg-white border border-stone-300 rounded px-1.5 py-1 text-xs">
                                <option value="" disabled selected>Rozmiar czcionki</option>
                                <option value="1">Mały (1)</option>
                                <option value="3">Normalny (3)</option>
                                <option value="5">Duży (5)</option>
                                <option value="7">Bardzo duży (7)</option>
                            </select>
                            
                            <span class="w-px h-4 bg-stone-300 mx-1"></span>
                            <button type="button" onclick="insertLink()" class="p-1.5 hover:bg-stone-200 rounded px-2" title="Wstaw link">🔗 Link</button>
                            <button type="button" onclick="insertTable()" class="p-1.5 hover:bg-stone-200 rounded px-2" title="Wstaw tabelę">📊 Tabela</button>
                        </div>

                        <!-- Edytowalny kontener treści -->
                        <div id="announcement-content-editable" contenteditable="true" class="w-full px-4 py-3 border border-stone-300 rounded-b-xl focus:ring-2 focus:ring-emerald-600 focus:outline-none bg-white"></div>
                        <textarea id="announcement-content" class="hidden"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-stone-700 mb-1">Zdjęcie (opcjonalnie)</label>
                        <input type="file" id="announcement-image" accept="image/*" class="w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                        <p class="text-xs text-stone-400 mt-1">Zdjęcie zostanie automatycznie przekonwertowane.</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <button type="submit" id="save-btn" class="bg-emerald-800 hover:bg-emerald-900 text-white font-semibold px-6 py-2.5 rounded-xl transition">Opublikuj ogłoszenie</button>
                        <button type="button" id="cancel-edit-btn" class="hidden bg-stone-200 hover:bg-stone-300 text-stone-800 font-semibold px-6 py-2.5 rounded-xl transition">Anuluj edycję</button>
                    </div>
                </form>
            </div>

            <!-- List of existing announcements -->
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-8">
                <h3 class="text-2xl font-serif text-emerald-900 mb-6">Zarządzaj ogłoszeniami</h3>
                <div id="admin-loader" class="text-stone-500 py-4">Ładowanie listy...</div>
                <div id="admin-list" class="space-y-4">
                    <!-- Dynamic admin list -->
                </div>
            </div>

        </section>

    </main>

    <footer class="bg-stone-200 text-stone-600 py-6 text-center text-sm mt-auto">
        <p>Panel CMS Parafii pw. Miłosierdzia Bożego w Mostówce | Wykonanie: <b>O5K4R Solutions</b></p>
    </footer>

    <!-- Narzędzia edytora tekstowego -->
    <script>
        function formatText(command) {
            document.execCommand(command, false, null);
        }
        function formatTextColor(color) {
            document.execCommand('foreColor', false, color);
        }
        function formatTextBgColor(color) {
            document.execCommand('hiliteColor', false, color);
        }
        function formatTextSize(size) {
            document.execCommand('fontSize', false, size);
        }
        function insertLink() {
            const url = prompt("Podaj adres URL linku:", "https://");
            if (url) {
                document.execCommand('createLink', false, url);
            }
        }
        function insertTable() {
            const rows = prompt("Liczba wierszy:", "2");
            const cols = prompt("Liczba kolumn:", "2");
            if (rows && cols) {
                let tableHtml = '<table style="border-collapse: collapse; width: 100%; margin: 10px 0;">';
                for (let i = 0; i < parseInt(rows); i++) {
                    tableHtml += '<tr>';
                    for (let j = 0; j < parseInt(cols); j++) {
                        tableHtml += '<td style="border: 1px solid #d6d3d1; padding: 8px;">Komórka</td>';
                    }
                    tableHtml += '</tr>';
                }
                tableHtml += '</table><p><br></p>';
                document.execCommand('insertHTML', false, tableHtml);
            }
        }
    </script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBi7eDzl8b2_ZsyiMWSEipDazx0h29rCw",
            authDomain: "parafiamostowka.firebaseapp.com",
            projectId: "parafiamostowka",
            storageBucket: "parafiamostowka.firebasestorage.app",
            messagingSenderId: "468721591440",
            appId: "1:468721591440:web:1bd98b3cfa42fbdc8e6415"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById('login-section');
        const cmsDashboard = document.getElementById('cms-dashboard');
        const userInfo = document.getElementById('user-info');
        const userEmailSpan = document.getElementById('user-email');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const loginBtnText = document.getElementById('login-btn-text');

        const announcementForm = document.getElementById('announcement-form');
        const announcementContentEditable = document.getElementById('announcement-content-editable');
        const announcementContent = document.getElementById('announcement-content');
        const formTitle = document.getElementById('form-title');
        const saveBtn = document.getElementById('save-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const editIdInput = document.getElementById('edit-id');
        const adminList = document.getElementById('admin-list');
        const adminLoader = document.getElementById('admin-loader');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('opacity-0', 'scale-95', 'hidden');
                setTimeout(() => {
                    cmsDashboard.classList.remove('hidden');
                    cmsDashboard.classList.add('fade-in');
                    userInfo.classList.remove('hidden');
                }, 150);
                userEmailSpan.textContent = user.email;
                loadAdminAnnouncements();
            } else {
                cmsDashboard.classList.add('hidden');
                userInfo.classList.add('hidden');
                loginSection.classList.remove('hidden', 'opacity-0', 'scale-95');
                loginSection.classList.add('fade-in');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            loginBtnText.textContent = "Logowanie...";
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginError.textContent = "Błąd logowania: " + error.message;
                loginError.classList.remove('hidden');
                loginBtnText.textContent = "Zaloguj się";
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
            loginBtnText.textContent = "Zaloguj się";
        });

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function getCurrentDateString() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            return `${day}.${month}.${year}`;
        }

        announcementForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            announcementContent.value = announcementContentEditable.innerHTML;
            
            const title = document.getElementById('announcement-title').value;
            const content = announcementContent.value;
            const imageFile = document.getElementById('announcement-image').files[0];
            const editId = editIdInput.value;

            saveBtn.disabled = true;
            saveBtn.textContent = "Zapisywanie...";

            try {
                let imageUrl = '';
                if (imageFile) {
                    imageUrl = await convertFileToBase64(imageFile);
                }

                if (editId) {
                    const docRef = doc(db, "announcements", editId);
                    const updateData = {
                        title,
                        content,
                        editedAtDate: getCurrentDateString()
                    };
                    if (imageUrl) {
                        updateData.imageUrl = imageUrl;
                    }

                    await updateDoc(docRef, updateData);
                    alert("Ogłoszenie zaktualizowano pomyślnie!");
                } else {
                    const newDoc = {
                        title,
                        content,
                        createdAtDate: getCurrentDateString(),
                        createdAt: Date.now()
                    };
                    if (imageUrl) {
                        newDoc.imageUrl = imageUrl;
                    }
                    await addDoc(collection(db, "announcements"), newDoc);
                    alert("Ogłoszenie dodano pomyślnie!");
                }

                resetForm();
                loadAdminAnnouncements();
            } catch (error) {
                console.error("Błąd zapisu: ", error);
                alert("Wystąpił błąd podczas zapisu: " + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = editId ? "Zapisz zmiany" : "Opublikuj ogłoszenie";
            }
        });

        function resetForm() {
            announcementForm.reset();
            announcementContentEditable.innerHTML = '';
            editIdInput.value = '';
            formTitle.textContent = "Dodaj nowe ogłoszenie";
            saveBtn.textContent = "Opublikuj ogłoszenie";
            cancelEditBtn.classList.add('hidden');
        }

        cancelEditBtn.addEventListener('click', resetForm);

        async function loadAdminAnnouncements() {
            adminLoader.style.display = 'block';
            adminList.innerHTML = '';
            try {
                const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                adminLoader.style.display = 'none';

                if (querySnapshot.empty) {
                    adminList.innerHTML = '<p class="text-stone-500 text-sm">Brak ogłoszeń w bazie.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const item = document.createElement('div');
                    item.className = 'border border-stone-200 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-stone-50/50 fade-in';
                    
                    let datesInfo = `<span class="text-xs text-stone-500">Dodano: ${data.createdAtDate || 'Brak'}</span>`;
                    if (data.editedAtDate) {
                        datesInfo += ` <span class="text-xs text-emerald-700 italic ml-2">Edytowano: ${data.editedAtDate}</span>`;
                    }

                    item.innerHTML = `
                        <div class="space-y-1">
                            <h4 class="font-bold text-stone-800">${escapeHtml(data.title)}</h4>
                            <div>${datesInfo}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="window.editAnnouncement('${id}', \`${escapeQuotes(data.title)}\`, \`${escapeQuotes(data.content)}\`)" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1.5 rounded-lg text-xs font-semibold transition">Edytuj</button>
                            <button onclick="window.deleteAnnouncement('${id}')" class="bg-red-100 hover:bg-red-200 text-red-800 px-3 py-1.5 rounded-lg text-xs font-semibold transition">Usuń</button>
                        </div>
                    `;
                    adminList.appendChild(item);
                });
            } catch (error) {
                console.error("Błąd ładowania admin:", error);
                adminLoader.innerHTML = '<p class="text-red-600 text-sm">Błąd ładowania listy ogłoszeń.</p>';
            }
        }

        window.editAnnouncement = (id, title, content) => {
            editIdInput.value = id;
            document.getElementById('announcement-title').value = title;
            announcementContentEditable.innerHTML = content;
            formTitle.textContent = "Edytuj ogłoszenie";
            saveBtn.textContent = "Zapisz zmiany";
            cancelEditBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteAnnouncement = async (id) => {
            if (confirm("Czy na pewno chcesz usunąć to ogłoszenie?")) {
                try {
                    await deleteDoc(doc(db, "announcements", id));
                    alert("Usunięto pomyślnie!");
                    loadAdminAnnouncements();
                } catch (error) {
                    alert("Błąd usuwania: " + error.message);
                }
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeQuotes(text) {
            if (!text) return '';
            return text.replace(/`/g, "\`").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
